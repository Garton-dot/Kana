<title>Kana Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one phone-width column, a board-game path of units, a fixed tab bar; quiz and results take the whole screen. */
:root {
  --bg: #FFF7F9; --surface: #FFFFFF; --sunk: #F6E9EF; --ink: #261A2B; --muted: #7C6A7A; --line: #EEDCE5;
  --accent: #E2366F; --accent-deep: #B81E55; --indigo: #4B4FD8; --gold: #D99400; --flame: #EE6510;
  --good: #16955A; --bad: #D33642; --ice: #1C93C9; --on-accent: #FFFFFF;
  --shadow: 0 2px 0 rgba(38,26,43,.08), 0 8px 24px rgba(226,54,111,.08);
  --f-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  --f-kana: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15111F; --surface: #211B30; --sunk: #2B2440; --ink: #F4EEF7; --muted: #ADA2BE; --line: #362D4C;
  --accent: #FF5C8F; --accent-deep: #D93A6E; --indigo: #9497FF; --gold: #FFC23D; --flame: #FF8C42;
  --good: #3FCB86; --bad: #FF6B74; --ice: #5CC8F5; --on-accent: #FFFFFF;
  --shadow: 0 2px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15111F; --surface: #211B30; --sunk: #2B2440; --ink: #F4EEF7; --muted: #ADA2BE; --line: #362D4C;
  --accent: #FF5C8F; --accent-deep: #D93A6E; --indigo: #9497FF; --gold: #FFC23D; --flame: #FF8C42;
  --good: #3FCB86; --bad: #FF6B74; --ice: #5CC8F5; --on-accent: #FFFFFF;
  --shadow: 0 2px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--indigo); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.kana { font-family: var(--f-kana); font-weight: 600; }

#app { max-width: 520px; margin: 0 auto; min-height: 100%; padding-inline: 16px; }
.page { padding-block: 16px 104px; display: grid; gap: 16px; }

/* Header */
.hdr { display: flex; align-items: center; gap: 12px; }
.lvl { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--sunk) 0); }
.lvl span { width: 42px; height: 42px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 900; font-size: 18px; }
.hdr-mid { flex: 1; min-width: 0; }
.hdr-mid b { font-size: 15px; }
.hdr-mid small { color: var(--muted); font-size: 12px; display: block; }
.bar { height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; width: calc(var(--p) * 1%); background: var(--accent); border-radius: inherit; transition: width .4s ease; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px; border-radius: 99px; font-weight: 700; font-size: 14px;
  color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 14%, transparent); white-space: nowrap; }

/* Daily goal */
.goal { display: flex; align-items: center; gap: 16px; background: var(--surface); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); }
.ring { --size: 64px; width: var(--size); height: var(--size); border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), color-mix(in srgb, var(--c) 15%, transparent) 0); }
.ring > span { width: calc(var(--size) - 16px); height: calc(var(--size) - 16px); border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 20px; }
.goal h3, .mode h3 { margin: 0; font-size: 16px; }
.goal p { margin: 0; color: var(--muted); }
.goal em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--c); }

/* Continue */
.go { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 20px 22px; border-radius: 26px; color: var(--on-accent);
  background: linear-gradient(120deg, var(--accent), var(--accent-deep)); box-shadow: 0 6px 0 color-mix(in srgb, var(--accent-deep) 70%, black); animation: breathe 2.2s ease-in-out infinite; }
.go:active { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent-deep) 70%, black); }
.go div { flex: 1; min-width: 0; }
.go small { letter-spacing: .14em; font-weight: 700; font-size: 12px; opacity: .85; }
.go strong { display: block; font-size: 22px; font-weight: 900; line-height: 1.2; }
.go .kana { font-size: 17px; opacity: .92; }
.go .arrow { font-size: 30px; }
@keyframes breathe { 50% { transform: scale(1.018); } }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode { position: relative; text-align: left; padding: 16px; border-radius: 22px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.mode[disabled] { opacity: .5; cursor: default; }
.mode .ico { font-size: 26px; }
.mode h3 { color: var(--c); }
.mode p { margin: 0; font-size: 13px; color: var(--muted); }
.badge { position: absolute; top: 12px; right: 12px; background: var(--bad); color: #fff; border-radius: 99px; font-size: 12px; font-weight: 900; padding: 1px 8px; }

.seg { display: flex; padding: 4px; border-radius: 99px; background: var(--sunk); }
.seg button { flex: 1; padding: 10px 4px; border-radius: 99px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* Unit path */
.path { display: grid; gap: 6px; position: relative; }
.unit { display: flex; align-items: center; gap: 14px; text-align: left; padding: 6px 8px 6px calc(8px + var(--x)); border-radius: 22px; }
.unit:not([disabled]):hover { background: var(--sunk); }
.unit[disabled] { cursor: default; }
.node { width: 66px; height: 66px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 30px; color: #fff;
  background: var(--c); box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 65%, black); }
.unit.next .node { outline: 4px solid var(--gold); outline-offset: 4px; animation: bob 1.6s ease-in-out infinite; }
.unit[disabled] .node { box-shadow: none; font-size: 22px; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.unit-txt { min-width: 0; }
.unit-txt b { display: block; }
.unit-txt .sub { color: var(--muted); font-size: 15px; }
.unit-txt .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.unit[disabled] .unit-txt { opacity: .5; }
.stars { letter-spacing: 1px; color: var(--line); }
.stars b { color: var(--gold); font-weight: 400; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; }
.tabs-in { display: flex; width: 100%; max-width: 488px; }
.tabs button { flex: 1; display: grid; justify-items: center; gap: 0; padding: 6px; border-radius: 16px; color: var(--muted); font-size: 12px; font-weight: 700; }
.tabs button span { font-size: 22px; line-height: 1.2; }
.tabs button[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }

/* Quiz */
.quiz { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding-block: 12px 16px; }
.qtop { display: flex; align-items: center; gap: 10px; }
.x { font-size: 22px; color: var(--muted); width: 40px; height: 40px; border-radius: 50%; }
.x:hover { background: var(--sunk); }
.qtop .bar { flex: 1; height: 14px; }
.qtop .bar i { background: var(--c, var(--good)); }
.combo { height: 38px; display: grid; place-items: center; }
.combo .pill { animation: pop .3s ease; }
@keyframes pop { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
.stage { flex: 1; display: flex; flex-direction: column; animation: slidein .28s ease; }
@keyframes slidein { from { opacity: 0; transform: translateX(28px); } }
.instr { color: var(--muted); font-weight: 700; margin: 0; }
.prompt { flex: 1; display: grid; place-items: center; text-align: center; min-height: 180px; padding-block: 8px; }
.prompt button { display: grid; justify-items: center; }
.prompt .big { font-size: 112px; line-height: 1.1; }
.prompt .mid { font-size: 64px; line-height: 1.15; }
.prompt .word { font-size: min(72px, calc(min(100vw, 520px) * .78 / var(--n, 4))); line-height: 1.25; white-space: nowrap; }
.prompt .en { font-size: 32px; font-weight: 900; line-height: 1.2; }
.prompt .hint { color: var(--muted); font-size: 22px; }
.prompt .say { font-size: 13px; color: var(--muted); }
.shake { animation: shake .35s ease; }
@keyframes shake { 20% { transform: translateX(-18px); } 40% { transform: translateX(16px); } 60% { transform: translateX(-10px); } 80% { transform: translateX(6px); } }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts.wide { grid-template-columns: 1fr; }
.opt { min-height: 74px; padding: 10px; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line);
  font-weight: 700; font-size: 20px; text-align: center; overflow-wrap: anywhere; }
.opts.wide .opt { min-height: 58px; }
.opt.jp { font-size: 34px; }
.opt.jp.long { font-size: 24px; }
.opt:not([disabled]):active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--surface)); box-shadow: 0 4px 0 var(--good); }
.opt.no { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--surface)); box-shadow: 0 4px 0 var(--bad); }
.opt.dim { opacity: .45; }
.opt[disabled] { cursor: default; }
.spacer { height: 220px; flex: none; }

.teach { flex: 1; display: grid; place-items: center; align-content: center; gap: 14px; text-align: center; }
.card { width: 100%; background: var(--surface); border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 32px; padding: 26px 34px; box-shadow: var(--shadow); display: grid; justify-items: center; max-width: 100%; }
.card .big { font-size: 128px; line-height: 1.1; }
.card .word { font-size: min(72px, calc(min(100vw, 520px) * .7 / var(--n, 4))); line-height: 1.25; white-space: nowrap; }
.card .kanji { font-size: 26px; color: var(--muted); }
.card .ro { font-size: 34px; font-weight: 900; color: var(--accent); }
.card .mean { font-size: 21px; }
.cta { width: 100%; min-height: 58px; border-radius: 18px; font-size: 18px; font-weight: 900; color: var(--on-accent); background: var(--c, var(--accent));
  box-shadow: 0 5px 0 color-mix(in srgb, var(--c, var(--accent)) 65%, black); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c, var(--accent)) 65%, black); }
.ghost { width: 100%; min-height: 52px; border-radius: 18px; font-weight: 700; border: 2px solid var(--line); }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; animation: up .22s ease; }
.sheet-in { max-width: 520px; margin: 0 auto; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); border-radius: 28px 28px 0 0;
  background: color-mix(in srgb, var(--c) 14%, var(--surface)); border-top: 2px solid color-mix(in srgb, var(--c) 40%, transparent); display: grid; gap: 6px; }
.sheet h3 { margin: 0; color: var(--c); font-size: 25px; font-weight: 900; display: flex; justify-content: space-between; gap: 8px; }
.sheet h3 span { color: var(--gold); }
.sheet p { margin: 0; color: var(--c); font-weight: 700; }
.sheet p.soft { color: var(--muted); font-weight: 500; font-size: 14px; }
@keyframes up { from { transform: translateY(100%); } }

.card .ex { font-size: 19px; margin-top: 14px; }
.card .ex-en { font-size: 14px; color: var(--muted); }
.import { background: var(--surface); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 8px; }
.import h3 { margin: 0; font-size: 20px; }
.import p { margin: 0; color: var(--muted); }
.import .how { font-size: 13px; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 14px 14px 14px 16px; border-radius: 18px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.notice div { flex: 1; min-width: 0; }
.notice b { color: var(--c); }
.notice p { margin: 2px 0 0; font-size: 14px; }
.ghost.small { width: auto; min-height: 40px; padding: 0 12px; font-size: 14px; }
.row .danger { padding: 0 4px; }

/* Results */
.res { padding-block: 32px 32px; display: grid; gap: 16px; justify-items: center; text-align: center; }
.res .hero { font-size: 72px; line-height: 1; }
.res h1 { margin: 0; font-size: 32px; font-weight: 900; text-wrap: balance; }
.res .from { color: var(--muted); margin-top: -10px; }
.bigstars { font-size: 60px; letter-spacing: 6px; color: var(--line); }
.bigstars b { display: inline-block; color: var(--gold); font-weight: 400; animation: starpop .5s cubic-bezier(.3,1.8,.5,1) both; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } }
.xpbig { font-size: 46px; font-weight: 900; color: var(--gold); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.tile { padding: 14px 6px; border-radius: 18px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.tile b { display: block; color: var(--c); font-size: 22px; font-weight: 900; }
.tile small { color: var(--muted); font-size: 12px; }
.rewards { display: grid; gap: 8px; width: 100%; }
.reward { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 14px; font-weight: 700;
  color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface)); animation: slidein .4s ease both; }
.reward span { font-size: 22px; }
.res .btns { display: grid; gap: 10px; width: 100%; margin-top: 8px; }
.learned { color: var(--muted); }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; width: 100%; height: 100%; }

/* Chart */
h2.title { margin: 0; font-size: 28px; font-weight: 900; }
.lead { margin: -8px 0 0; color: var(--muted); }
.grp h3 { margin: 6px 0 8px; font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.grid.combo3 { grid-template-columns: repeat(3, 1fr); }
.cell { aspect-ratio: .9; max-width: 100%; border-radius: 12px; display: grid; place-content: center; text-align: center; background: var(--m); }
.grid.combo3 .cell { aspect-ratio: 1.6; }
.cell .kana { font-size: 26px; line-height: 1.1; }
.cell small { color: var(--muted); font-size: 12px; }
.words { display: grid; gap: 6px; }
.wrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 10px 14px; border-radius: 12px; background: var(--m); }
.wrow > div { min-width: 0; }
.wrow .kana { font-size: 20px; }
.wrow small { color: var(--muted); display: block; }
.dots { display: flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--m); margin-right: 5px; vertical-align: -1px; }

/* Profile */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.stat b { font-size: 20px; font-weight: 900; display: block; }
.stat small { color: var(--muted); font-size: 12px; }
.goals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.goals button { padding: 10px 4px; border-radius: 14px; background: var(--surface); display: grid; box-shadow: var(--shadow); }
.goals button small { font-size: 12px; color: var(--muted); }
.goals button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.goals button[aria-pressed="true"] small { color: var(--on-accent); }
.row { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
.row > div { flex: 1; min-width: 0; }
.row small { color: var(--muted); display: block; font-size: 13px; }
.switch { width: 52px; height: 30px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.ach { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--surface); }
.ach.got { background: color-mix(in srgb, var(--gold) 16%, var(--surface)); }
.ach:not(.got) { opacity: .5; }
.ach span { font-size: 26px; }
.ach small { color: var(--muted); display: block; }
.sec { margin: 8px 0 0; font-size: 20px; font-weight: 900; }
.danger { color: var(--bad); font-weight: 700; padding: 10px 0; justify-self: start; }
.confirm { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.confirm p { margin: 0; }
.confirm div { display: flex; gap: 10px; }
.confirm button { flex: 1; min-height: 46px; border-radius: 14px; font-weight: 700; border: 2px solid var(--line); }
.confirm .yes { background: var(--bad); color: #fff; border-color: var(--bad); }
.sync { font-size: 12px; color: var(--muted); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

const TRACKS = {
  hiragana: { title: "Hiragana", native: "ひらがな" },
  katakana: { title: "Katakana", native: "カタカナ" },
  vocab: { title: "Vocabulary", native: "ことば" },
  deck: { title: "Anki deck", native: "Anki" },
};
const toKata = s => [...s].map(c => { const p = c.codePointAt(0); return p >= 0x3041 && p <= 0x3096 ? String.fromCodePoint(p + 0x60) : c; }).join("");

const Course = (() => {
  const units = [];
  for (const track of ["hiragana", "katakana"]) {
    const pre = track === "hiragana" ? "h" : "k";
    for (const [key, title, chars] of ROWS) {
      const id = `${pre}-${key}`;
      const items = chars.map(([h, romaji]) => {
        const jp = track === "hiragana" ? h : toKata(h);
        return { id: `${pre}:${jp}`, kind: "kana", jp, romaji, meaning: "", kanji: null, unitId: id };
      });
      units.push({ id, track, title, subtitle: items.slice(0, 5).map(i => i.jp).join(" "), items });
    }
  }
  LESSONS.forEach(([title, subtitle, raw], i) => {
    const id = `v-${i + 1}`;
    const items = raw.trim().split("\n").map(line => {
      const [jp, romaji, meaning, kanji] = line.trim().split("|");
      return { id: `v:${jp}`, kind: "vocab", jp, romaji, meaning, kanji: kanji || null, unitId: id };
    });
    units.push({ id, track: "vocab", title, subtitle, items });
  });
  const C = {
    deckName: null, units: [], items: [], byItem: new Map(), byUnit: new Map(),
    // Swaps in (or removes, with null) the learner's imported Anki deck as its own track.
    install(deck) {
      C.deckName = deck ? deck.name : null;
      C.units = [...units, ...(deck ? deckUnits(deck) : [])];
      C.items = C.units.flatMap(u => u.items);
      C.byItem = new Map(C.items.map(i => [i.id, i]));
      C.byUnit = new Map(C.units.map(u => [u.id, u]));
    },
    item: id => C.byItem.get(id), unit: id => C.byUnit.get(id),
    unitsOf: t => C.units.filter(u => u.track === t),
    itemsOf: t => C.units.filter(u => u.track === t).flatMap(u => u.items),
  };
  C.install(null);
  return C;
})();

// Stable ids: the same word in a re-imported deck keeps its progress.
function deckItemIds(words) {
  const seenKeys = new Map();
  return words.map(([w, r, m]) => { const k = `d:${w}|${r}|${m}`, n = (seenKeys.get(k) || 0) + 1; seenKeys.set(k, n); return n === 1 ? k : `${k}#${n}`; });
}
const DECK_UNIT = 25;
function deckUnits(deck) {
  const ids = deckItemIds(deck.words), out = [];
  for (let i = 0; i < deck.words.length; i += DECK_UNIT) {
    const id = `d-${out.length + 1}`;
    const items = deck.words.slice(i, i + DECK_UNIT).map(([word, reading, meaning, sentence, sentenceEn], k) => {
      const jp = reading || word;
      return { id: ids[i + k], kind: "word", jp, romaji: toRomaji(jp) || "", meaning, kanji: word !== jp ? word : null, sentence: sentence || null, sentenceEn: sentenceEn || null, unitId: id };
    });
    out.push({ id, track: "deck", title: `Set ${out.length + 1}`, subtitle: items.slice(0, 4).map(written).join(" "), items });
  }
  return out;
}
// How a word is written: deck words lead with their kanji, everything else with kana.
function written(it) { return it.kind === "word" ? (it.kanji || it.jp) : it.jp; }

// Kana → Hepburn romaji in the course's style ("sayounara", "koohii"); null if the text isn't all kana.
const ROMAJI = (() => {
  const m = {};
  const rows = [["あいうえお", "a i u e o"], ["かきくけこ", "ka ki ku ke ko"], ["さしすせそ", "sa shi su se so"], ["たちつてと", "ta chi tsu te to"],
    ["なにぬねの", "na ni nu ne no"], ["はひふへほ", "ha hi fu he ho"], ["まみむめも", "ma mi mu me mo"], ["らりるれろ", "ra ri ru re ro"],
    ["がぎぐげご", "ga gi gu ge go"], ["ざじずぜぞ", "za ji zu ze zo"], ["だぢづでど", "da ji zu de do"], ["ばびぶべぼ", "ba bi bu be bo"],
    ["ぱぴぷぺぽ", "pa pi pu pe po"], ["ぁぃぅぇぉ", "a i u e o"], ["やゆよわをんゔゃゅょゎ", "ya yu yo wa o n vu ya yu yo wa"]];
  for (const [k, r] of rows) { const rs = r.split(" "); [...k].forEach((c, i) => m[c] = rs[i]); }
  const d = "きゃkya きゅkyu きょkyo しゃsha しゅshu しょsho ちゃcha ちゅchu ちょcho にゃnya にゅnyu にょnyo ひゃhya ひゅhyu ひょhyo みゃmya みゅmyu みょmyo りゃrya りゅryu りょryo ぎゃgya ぎゅgyu ぎょgyo じゃja じゅju じょjo ぢゃja ぢゅju ぢょjo びゃbya びゅbyu びょbyo ぴゃpya ぴゅpyu ぴょpyo しぇshe ちぇche じぇje てぃti でぃdi ふぁfa ふぃfi ふぇfe ふぉfo うぃwi うぇwe ゔぁva";
  for (const e of d.split(" ")) m[e.slice(0, 2)] = e.slice(2);
  return m;
})();
function toRomaji(text) {
  const k = [...text].map(c => { const p = c.codePointAt(0); return p >= 0x30A1 && p <= 0x30F6 ? String.fromCodePoint(p - 0x60) : c; });
  let out = "", dbl = false;
  for (let i = 0; i < k.length; i++) {
    const c = k[i];
    if (c === "っ") { dbl = true; continue; }
    if (c === "ー") { const v = [...out].reverse().find(x => "aeiou".includes(x)); if (v) out += v; continue; }
    if (c === " " || c === "　" || c === "・") { out += " "; continue; }
    let ro = ROMAJI[c + (k[i + 1] || "")];
    if (ro && (c + (k[i + 1] || "")).length === 2 && k[i + 1]) i++; else ro = ROMAJI[c];
    if (!ro) return null;
    if (dbl) out += ro.startsWith("ch") ? "t" : ro[0];
    dbl = false; out += ro;
  }
  return out;
}

const MIN = 60000, DAY = 24 * 60 * MIN;
const Srs = {
  MAX: 5, MASTERED: 4,
  INTERVALS: [0, 10 * MIN, DAY, 3 * DAY, 7 * DAY, 21 * DAY],
  onAnswer(p, correct, now) {
    p = p || [0, 0, 0, 0]; // [box, due, seen, correct]
    const box = correct ? Math.min(p[0] + 1, Srs.MAX) : Math.max(p[0] - 2, 0);
    return [box, now + Srs.INTERVALS[box], p[2] + 1, p[3] + (correct ? 1 : 0)];
  },
  isDue: (p, now) => !!p && p[2] > 0 && p[1] <= now,
};

const Gamify = {
  BASE: 10, GOAL_BONUS: 20, MAX_FREEZES: 2,
  mult: c => c >= 20 ? 3 : c >= 10 ? 2 : c >= 5 ? 1.5 : 1,
  xpFor: c => Math.round(10 * Gamify.mult(c)),
  xpForLevel: l => 50 * l * (l - 1),
  level(xp) { let l = 1; while (Gamify.xpForLevel(l + 1) <= xp) l++; return l; },
  levelProgress(xp) { const l = Gamify.level(xp), s = Gamify.xpForLevel(l); return [xp - s, Gamify.xpForLevel(l + 1) - s]; },
  stars(c, t) { if (!t) return 0; const a = c / t; return a >= 1 ? 3 : a >= .85 ? 2 : a >= .6 ? 1 : 0; },
  cheers: ["すごい!", "いいね!", "Nice!", "完璧!", "やった!", "Great!", "Sugoi!", "Keep going!"],
};

const seen = (s, id) => (s.items[id]?.[2] || 0) > 0;
const box = (s, id) => s.items[id]?.[0] || 0;
const trackCleared = (s, t) => Course.unitsOf(t).every(u => (s.unitStars[u.id] || 0) >= 1);
const ACHIEVEMENTS = [
  ["FIRST_STEPS", "👣", "First Steps", "Finish your first session", s => s.sessions >= 1],
  ["COMBO_10", "🔥", "On Fire", "Hit a 10× combo", s => s.bestCombo >= 10],
  ["COMBO_25", "☄️", "Unstoppable", "Hit a 25× combo", s => s.bestCombo >= 25],
  ["PERFECT", "💯", "Perfectionist", "Earn 3 stars on a unit", s => Object.values(s.unitStars).some(n => n >= 3)],
  ["STREAK_3", "📅", "Habit Forming", "Reach a 3-day streak", s => s.bestStreak >= 3],
  ["STREAK_7", "🗓️", "Week Warrior", "Reach a 7-day streak", s => s.bestStreak >= 7],
  ["STREAK_30", "🏯", "Shogun", "Reach a 30-day streak", s => s.bestStreak >= 30],
  ["HIRAGANA_ALL", "🌸", "Hiragana Hero", "Clear every hiragana unit", s => trackCleared(s, "hiragana")],
  ["KATAKANA_ALL", "⚡", "Katakana King", "Clear every katakana unit", s => trackCleared(s, "katakana")],
  ["VOCAB_ALL", "📚", "Wordsmith", "Clear lessons 1–5", s => trackCleared(s, "vocab")],
  ["WORDS_50", "🧠", "Lexicon", "Know 50 words well", s => Course.itemsOf("vocab").filter(i => box(s, i.id) >= 3).length >= 50],
  ["DECK_100", "🀄", "Collector", "Know 100 words from your Anki deck", s => Course.itemsOf("deck").filter(i => box(s, i.id) >= 3).length >= 100],
  ["LIGHTNING_30", "⏱️", "Speed Demon", "Score 30 in Lightning", s => s.lightningBest >= 30],
  ["LEVEL_10", "👑", "Level 10", "Reach level 10", s => Gamify.level(s.totalXp) >= 10],
  ["SESSIONS_50", "🎌", "Dedicated", "Complete 50 sessions", s => s.sessions >= 50],
].map(([key, emoji, title, desc, earned]) => ({ key, emoji, title, desc, earned }));

const freshState = () => ({
  totalXp: 0, items: {}, unitStars: {}, streak: 0, bestStreak: 0, lastPracticeDay: -1, todayXp: 0, todayDay: -1,
  dailyGoal: 100, goalClaimedDay: -1, bestCombo: 0, lightningBest: 0, achievements: [], sessions: 0, freezes: 0,
  sound: true, updatedAt: 0,
});

const P = {
  isUnlocked(s, u) {
    const l = Course.unitsOf(u.track), i = l.indexOf(u);
    // A unit with words already studied (say, in Anki before importing) is open too.
    return i <= 0 || (s.unitStars[l[i - 1].id] || 0) >= 1 || u.items.some(it => seen(s, it.id));
  },
  seenCount: (s, u) => u.items.filter(i => seen(s, i.id)).length,
  mastered: (s, items) => items.filter(i => box(s, i.id) >= Srs.MASTERED).length,
  due: (s, now) => Course.items.filter(i => Srs.isDue(s.items[i.id], now)).sort((a, b) => s.items[a.id][1] - s.items[b.id][1]),
  unlockedItems: (s, t) => Course.unitsOf(t).filter(u => P.isUnlocked(s, u)).flatMap(u => u.items),
  seenItems: (s, kind) => Course.items.filter(i => (!kind || i.kind === kind) && seen(s, i.id)),
  nextUnit(s, track) {
    const inTrack = track ? Course.unitsOf(track) : [];
    const un = (inTrack.length ? inTrack : Course.units).filter(u => P.isUnlocked(s, u));
    return un.find(u => !(s.unitStars[u.id] || 0)) || un.reduce((a, b) => (s.unitStars[b.id] || 0) < (s.unitStars[a.id] || 0) ? b : a, un[0]);
  },
  streakNow(s, today) {
    if (s.lastPracticeDay >= today - 1) return s.streak;
    if (s.lastPracticeDay === today - 2 && s.freezes > 0) return s.streak;
    return 0;
  },
  todayXp: (s, today) => s.todayDay === today ? s.todayXp : 0,
  complete(prev, sum, now, today) {
    const s = structuredClone(prev);
    for (const [id, ok] of sum.answers) s.items[id] = Srs.onAnswer(s.items[id], ok, now);
    const last = s.lastPracticeDay;
    let freezes = s.freezes, streak;
    if (last === today) streak = s.streak;
    else if (last === today - 1) streak = s.streak + 1;
    else if (last === today - 2 && freezes > 0) { freezes--; streak = s.streak + 1; }
    else streak = 1;
    const streakUp = last !== today;
    const earnedFreeze = streakUp && streak % 7 === 0 && freezes < Gamify.MAX_FREEZES;
    if (earnedFreeze) freezes++;

    let todayXp = P.todayXp(s, today) + sum.xp;
    const goalBonus = todayXp >= s.dailyGoal && s.goalClaimedDay !== today ? Gamify.GOAL_BONUS : 0;
    todayXp += goalBonus;
    const levelBefore = Gamify.level(s.totalXp);

    const unit = sum.unitId ? Course.unit(sum.unitId) : null;
    let stars = null, unlocked = null;
    if (unit && sum.mode === "lesson" && P.seenCount(s, unit) === unit.items.length) {
      stars = Gamify.stars(sum.firstTry, sum.questions);
      const before = s.unitStars[unit.id] || 0;
      if (stars > before) s.unitStars[unit.id] = stars;
      if (!before && stars >= 1) { const l = Course.unitsOf(unit.track); unlocked = l[l.indexOf(unit) + 1] || null; }
    }
    const lightning = sum.mode === "lightning" ? sum.firstTry : 0;
    const newBest = lightning > s.lightningBest;

    Object.assign(s, {
      totalXp: s.totalXp + sum.xp + goalBonus, todayXp, todayDay: today,
      goalClaimedDay: goalBonus ? today : s.goalClaimedDay, streak, bestStreak: Math.max(s.bestStreak, streak),
      lastPracticeDay: today, freezes, bestCombo: Math.max(s.bestCombo, sum.maxCombo),
      lightningBest: Math.max(s.lightningBest, lightning), sessions: s.sessions + 1,
    });
    const newAch = ACHIEVEMENTS.filter(a => !s.achievements.includes(a.key) && a.earned(s));
    s.achievements = [...s.achievements, ...newAch.map(a => a.key)];
    const levelAfter = Gamify.level(s.totalXp);
    return [s, { xp: sum.xp, goalBonus, stars, newAch, levelUp: levelAfter > levelBefore ? levelAfter : null, unlocked, streak, streakUp, earnedFreeze, newBest }];
  },
};

const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];

const Q = {
  types: it => it.kind === "kana" ? ["k2r", "r2k"] : it.kind === "word" && it.kanji ? ["w2m", "m2w", "k2read"] : ["w2m", "m2w"],
  answer: (it, t) => ({ k2r: it.romaji, r2k: it.jp, w2m: it.meaning, m2w: written(it), k2read: it.jp })[t],
  prompt: (it, t) => ({ k2r: it.jp, r2k: it.romaji, w2m: written(it), m2w: it.meaning, k2read: written(it) })[t],
  question(item, pool, type = pick(Q.types(item))) {
    const ans = Q.answer(item, type), pr = Q.prompt(item, type);
    // A distractor must not also be right (じ and ぢ are both "ji").
    const ok = o => o.kind === item.kind && o.id !== item.id && Q.answer(o, type) !== ans && Q.prompt(o, type) !== pr;
    const near = shuffle(pool.filter(ok)).sort((a, b) => (a.unitId === item.unitId ? 0 : 1) - (b.unitId === item.unitId ? 0 : 1));
    const far = shuffle(Course.items.filter(ok));
    const distractors = [...new Set([...near, ...far].map(o => Q.answer(o, type)))].slice(0, 3);
    const options = shuffle([...distractors, ans]);
    return { item, type, prompt: pr, hint: type === "w2m" && item.kind === "vocab" ? item.kanji : null, options, correct: options.indexOf(ans), retry: false };
  },
  weighted(items, s) {
    const w = items.map(i => Srs.MAX + 1 - box(s, i.id));
    let roll = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < items.length; i++) { if (roll < w[i]) return items[i]; roll -= w[i]; }
    return items[items.length - 1];
  },
  lesson(unit, s, pool, maxNew = 5, asks = 12) {
    const steps = [];
    const fresh = unit.items.filter(i => !seen(s, i.id)).slice(0, maxNew);
    for (let i = 0; i < fresh.length; i += 2) {
      const chunk = fresh.slice(i, i + 2);
      chunk.forEach(it => steps.push({ teach: it }));
      shuffle(chunk).forEach(it => steps.push({ ask: Q.question(it, pool, Q.types(it)[0]) }));
    }
    const practice = [...unit.items.filter(i => seen(s, i.id)), ...fresh];
    let prev = fresh[fresh.length - 1];
    while (steps.filter(x => x.ask).length < asks && practice.length) {
      const cands = practice.filter(i => i !== prev);
      const it = Q.weighted(cands.length ? cands : practice, s);
      steps.push({ ask: Q.question(it, pool) });
      prev = it;
    }
    return steps;
  },
  review: (items, poolFor) => shuffle(items).map(it => ({ ask: Q.question(it, poolFor(it)) })),
  lightning: (items, poolFor, n = 20) => Array.from({ length: n }, () => pick(items)).map(it => ({ ask: Q.question(it, poolFor(it)) })),
};

function Session(mode, unitId, steps, retry, refill) {
  const q = [...steps];
  const S = { mode, unitId, current: q.shift() || null, combo: 0, maxCombo: 0, xp: 0, firstTry: 0, questions: 0, done: 0, answers: [] };
  S.left = () => q.length;
  S.progress = () => { const t = S.done + q.length + (S.current ? 1 : 0); return t ? S.done / t : 1; };
  S.answer = choice => {
    const qq = S.current.ask, ok = choice === qq.correct;
    let gained = 0;
    if (!qq.retry) { S.questions++; S.answers.push([qq.item.id, ok]); }
    if (ok) { S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo); gained = Gamify.xpFor(S.combo); S.xp += gained; if (!qq.retry) S.firstTry++; }
    else { S.combo = 0; if (mode !== "lightning") q.push({ ask: { ...retry(qq.item), retry: true } }); }
    return { ok, chosen: choice, correct: qq.correct, gained, combo: S.combo };
  };

async function readApkg(file) {

    const fieldNames = new Map();

    else for (const [ntid, name] of rows("select ntid, name from fields order by ntid, ord")) { if (!fieldNames.has(ntid)) fieldNames.set(ntid, []); fieldNames.get(ntid).push(name); }
    const notes = rows("select id, mid, flds from notes").map(([id, mid, flds]) => ({ id, fieldNames: fieldNames.get(mid) || [], fields: String(flds).split("\x1f") }));
    const perDeck = new Map();
    const cards = rows("select nid, type, queue, ivl, due, reps, lapses, did from cards").map(([noteId, type, queue, ivl, due, reps, lapses, did]) => {
      perDeck.set(did, (perDeck.get(did) || 0) + 1); return { noteId, type, queue, ivl, due, reps, lapses };
    });
    const main = [...perDeck].sort((a, b) => b[1] - a[1])[0]?.[0];
    let deckName = "Anki deck";
    try { deckName = (decks && decks.length > 2 ? JSON.parse(decks)[main].name : rows("select name from decks where id = ?", [main])[0][0]) || deckName; } catch {}

}

    // Reading the word aloud is a hint, except when its reading is the question (k2read).
    const q = st.ask, jpPrompt = q.type === "k2r" || q.type === "w2m", jpOpts = !jpPrompt;
    const instr = { k2r: "What sound is this?", r2k: "Pick the kana", w2m: "What does this mean?", m2w: "How do you say this?", k2read: "How do you read this?" }[q.type];
    const cls = { k2r: "kana big", w2m: "kana word", r2k: "mid", m2w: "en", k2read: "kana word" }[q.type];
    const wide = q.options.some(o => o.length > (jpOpts ? 4 : 7));
    const promptInner = `<span class="${cls}" style="--n:${[...q.prompt].length}">${esc(q.prompt)}</span>${q.hint ? `<span class="hint kana">${esc(q.hint)}</span>` : ""}${jpPrompt && !light ? `<span class="say">🔊 tap to hear</span>` : ""}`;
    stage = `<p class="instr">${instr}${q.retry ? " · try again" : ""}</p>
      <div class="prompt ${fb && !fb.ok ? "shake" : ""}">${jpPrompt ? `<button data-act="speak" data-v="${esc(q.item.jp)}">${promptInner}</button>` : `<div>${promptInner}</div>`}</div>
      <div class="opts ${wide ? "wide" : ""}">${q.options.map((o, i) => {
        const state2 = !fb ? "" : i === q.correct ? "ok" : i === fb.chosen ? "no" : "dim";
        return `<button class="opt ${jpOpts ? "jp kana" : ""} ${jpOpts && o.length > 2 ? "long" : ""} ${state2}" data-act="ans" data-v="${i}" ${fb ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("")}</div><div class="spacer"></div>`;
  }
  let sheet = "";
  if (fb && st?.ask) {
    const it = st.ask.item, line = esc(describe(it));
    sheet = fb.ok
      ? `<div class="sheet" style="--c:var(--good)"><div class="sheet-in"><h3>${pick(Gamify.cheers)}<span class="num">+${fb.gained} XP</span></h3><p class="kana">${line}</p></div></div>`
      : `<div class="sheet" style="--c:var(--bad)"><div class="sheet-in"><h3>Not quite</h3><p class="kana">${line}</p>
         ${light ? "" : `<p class="soft">It comes back at the end of this lesson.</p><button class="cta" style="--c:var(--bad)" data-act="next" id="cont">Continue</button>`}</div></div>`;
  }
  app.innerHTML = `<section class="quiz" aria-label="${esc(ui.title)}">
    <div class="qtop"><button class="x" data-act="quit" aria-label="Quit session">✕</button>${top}</div>
    <div class="combo">${combo}</div>
    <div class="stage" ${fb ? 'style="animation:none"' : ""}>${stage}</div>
  </section>${sheet}`;
  document.getElementById("cont")?.focus();
}

function renderResults() {
  const { sum, rw, title, unit } = ui.results;
  const light = sum.mode === "lightning";
  const acc = sum.questions ? Math.round(sum.firstTry * 100 / sum.questions) : 0;
  const celebrate = light || (rw.stars || 0) > 0 || acc >= 80;
  const hero = light ? "⚡" : rw.stars === 3 ? "🏆" : acc >= 80 ? "🎉" : "💪";
  const head = light ? (rw.newBest ? "New record!" : "Time's up!") : rw.stars === 3 ? "Perfect!" : acc >= 80 ? "Great work!" : "Practice makes perfect";
  const lines = [];
  if (rw.streakUp) lines.push(["🔥", `Streak extended to ${rw.streak} day${rw.streak === 1 ? "" : "s"}`, "var(--flame)"]);
  if (rw.goalBonus) lines.push(["🎁", `Daily goal reached. Chest: +${rw.goalBonus} XP`, "var(--gold)"]);
  if (rw.levelUp) lines.push(["⬆️", `Level up! You're now level ${rw.levelUp}`, "var(--indigo)"]);
  if (rw.unlocked) lines.push(["🔓", `Unlocked: ${TRACKS[rw.unlocked.track].native} · ${rw.unlocked.title}`, "var(--good)"]);
  if (rw.earnedFreeze) lines.push(["❄️", "Streak freeze earned. It covers one missed day", "var(--ice)"]);
  if (light && rw.newBest) lines.push(["⚡", `New Lightning best: ${sum.firstTry}`, "var(--flame)"]);
  rw.newAch.forEach(a => lines.push([a.emoji, `Achievement: ${a.title}`, "var(--accent)"]));
  let primary;
  if (rw.unlocked) primary = `<button class="cta" data-act="lesson" data-v="${rw.unlocked.id}">Next: ${esc(rw.unlocked.title)} ▶</button>`;
  else if (unit) primary = `<button class="cta" data-act="lesson" data-v="${unit.id}">Keep going ▶</button>`;
  else if (light) primary = `<button class="cta" style="--c:var(--flame)" data-act="lightning">Play again ⚡</button>`;
  else primary = `<button class="cta" data-act="home">Continue</button>`;
  app.innerHTML = `<main class="res">
    <div class="hero">${hero}</div><h1>${head}</h1><div class="from kana">${esc(title)}</div>
    ${rw.stars != null ? `<div class="bigstars" aria-label="${rw.stars} of 3 stars">${[0, 1, 2].map(i => i < rw.stars ? `<b style="animation-delay:${.3 + i * .3}s">★</b>` : "★").join("")}</div>`
      : unit && sum.mode === "lesson" ? `<p class="learned">Learned ${P.seenCount(state, unit)} of ${unit.items.length}. Meet them all to earn stars ⭐</p>` : ""}
    <div class="xpbig num" id="xpc">+0 XP</div>
    <div class="tiles">
      ${light ? `<div class="tile" style="--c:var(--flame)"><b class="num">${sum.firstTry}</b><small>Score</small></div>` : `<div class="tile" style="--c:var(--good)"><b class="num">${acc}%</b><small>Accuracy</small></div>`}
      <div class="tile" style="--c:var(--accent)"><b class="num">${sum.maxCombo}×</b><small>Best combo</small></div>
      <div class="tile" style="--c:var(--flame)"><b class="num">🔥${rw.streak}</b><small>Streak</small></div>
    </div>
    <div class="rewards">${lines.map(([e, t, c], i) => `<div class="reward" style="--c:${c};animation-delay:${.5 + i * .15}s"><span>${e}</span>${esc(t)}</div>`).join("")}</div>
    <div class="btns">${primary}<button class="ghost" data-act="home">Home</button></div>
  </main>`;
  const total = rw.xp + rw.goalBonus, el = document.getElementById("xpc"), t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / 1100); el.textContent = `+${Math.round(total * (1 - Math.pow(1 - k, 3)))} XP`; if (k < 1 && ui.screen === "results") requestAnimationFrame(step); };
  requestAnimationFrame(step);
  if (celebrate) confetti();
}

function chartHtml() {
  const s = state, t = ui.track, all = Course.itemsOf(t);
  const tone = id => !seen(s, id) ? "color-mix(in srgb, var(--muted) 12%, transparent)"
    : box(s, id) >= Srs.MASTERED ? "color-mix(in srgb, var(--gold) 40%, transparent)"
    : `color-mix(in srgb, var(--accent) ${12 + box(s, id) * 10}%, transparent)`;
  const groups = Course.unitsOf(t).map(u => {
    if (t === "vocab" || t === "deck") return `<div class="grp"><h3>${esc(u.title)} · <span class="kana">${esc(u.subtitle)}</span></h3><div class="words">${u.items.map(i => {
      const second = i.kind === "word" ? (i.kanji ? i.jp : null) : i.kanji;
      return `<button class="wrow" style="--m:${tone(i.id)}" data-act="speak" data-v="${esc(i.jp)}"><div><span class="kana">${esc(written(i))}</span>${second ? ` <span class="kana" style="color:var(--muted)">${esc(second)}</span>` : ""}<small>${esc(i.romaji)}</small></div>
       <div>${esc(i.meaning)}</div><span class="dots" aria-label="Memory level ${box(s, i.id)} of 5">${[0, 1, 2, 3, 4].map(k => `<i class="${k < box(s, i.id) ? "on" : ""}"></i>`).join("")}</span></button>`; }).join("")}</div></div>`;
    const combo = u.items[0].jp.length > 1;
    return `<div class="grp"><h3>${esc(u.title)}</h3><div class="grid ${combo ? "combo3" : ""}">${u.items.map(i =>
      `<button class="cell" style="--m:${tone(i.id)}" data-act="speak" data-v="${esc(i.jp)}" aria-label="${esc(i.jp)} ${esc(i.romaji)}"><span class="kana">${esc(i.jp)}</span><small>${esc(i.romaji)}</small></button>`).join("")}</div></div>`;
  }).join("");
  return `<h2 class="title">Chart</h2><p class="lead num">${P.mastered(s, all)} of ${all.length} mastered. Tap any card to hear it.</p>
  ${trackSeg()}
  <div class="legend"><span style="--m:color-mix(in srgb, var(--muted) 12%, transparent)">Not met yet</span><span style="--m:color-mix(in srgb, var(--accent) 32%, transparent)">Learning</span><span style="--m:color-mix(in srgb, var(--gold) 40%, transparent)">Mastered</span></div>
  ${groups}`;
}

function profileHtml() {
  const s = state;
  const kana = Course.items.filter(i => i.kind === "kana"), words = Course.itemsOf("vocab");
  const stats = [["⭐", Gamify.level(s.totalXp), "Level"], ["⚡", s.totalXp, "Total XP"], ["🔥", s.bestStreak, "Best streak"], ["☄️", s.bestCombo, "Best combo"],
    ["⏱️", s.lightningBest, "Lightning best"], ["🎌", s.sessions, "Sessions"], ["あ", `${P.mastered(s, kana)}/${kana.length}`, "Kana mastered"], ["📚", `${P.mastered(s, words)}/${words.length}`, "Words mastered"]];
  const deckItems = Course.itemsOf("deck");
  if (Course.deckName) stats.push(["🀄", `${P.mastered(s, deckItems)}/${deckItems.length}`, "Anki words mastered"], ["🃏", deckItems.filter(i => seen(s, i.id)).length, "Anki words studied"]);
  return `<h2 class="title">Profile</h2>
  <div class="stats">${stats.map(([e, v, l]) => `<div class="stat"><b class="num">${e} ${v}</b><small>${l}</small></div>`).join("")}</div>
  <h3 class="sec">Daily goal</h3>
  <div class="goals" role="group" aria-label="Daily goal">${[[50, "Casual"], [100, "Regular"], [200, "Serious"], [300, "Insane"]].map(([x, n]) =>
    `<button data-act="goal" data-v="${x}" aria-pressed="${s.dailyGoal === x}"><b>${n}</b><small class="num">${x} XP</small></button>`).join("")}</div>
  <div class="row"><div><b>Sound</b><small>Japanese voice and answer chimes</small></div>
    <button class="switch" role="switch" id="sound" aria-label="Sound" aria-checked="${s.sound}" data-act="sound"></button></div>
  <h3 class="sec">Anki deck</h3>
  ${!Course.deckName ? importCard() : ui.confirmRemove
    ? `<div class="confirm"><p><b>Remove the Anki deck?</b> Its words leave this browser. Your progress on them is kept, so importing the deck again brings it all back.</p>
       <div><button data-act="deck-keep">Cancel</button><button class="yes" data-act="deck-remove-yes">Remove</button></div></div>`
    : `<div class="row"><div><b>🀄 ${esc(Course.deckName)}</b><small class="num">${deckItems.length} words · import again to refresh your Anki history</small></div>
       <button class="ghost small" data-act="import" ${ui.importing ? "disabled" : ""}>${ui.importing ? "Importing…" : "Re-import"}</button>
       <button class="danger" data-act="deck-remove">Remove</button></div>`}
  <h3 class="sec">Achievements · <span class="num">${s.achievements.length}/${ACHIEVEMENTS.length}</span></h3>
  ${ACHIEVEMENTS.map(a => { const got = s.achievements.includes(a.key);
    return `<div class="ach ${got ? "got" : ""}"><span>${got ? a.emoji : "🔒"}</span><div><b>${a.title}</b><small>${a.desc}</small></div></div>`; }).join("")}
  <div class="row"><div><b>Make it feel like an app</b><small>Open this page in your phone's browser and choose “Add to Home Screen”.</small></div></div>
  ${ui.confirmReset ? `<div class="confirm"><p><b>Reset everything?</b> XP, streak, stars and every learned kana will be wiped. This can't be undone.</p>
    <div><button data-act="reset-no">Cancel</button><button class="yes" data-act="reset-yes">Reset</button></div></div>`
    : `<button class="danger" data-act="reset">Reset all progress</button>`}
  <p class="sync">${syncStatus === "synced" ? "Progress saved to your account" : "Progress saved in this browser"}</p>`;
}

// ───────────── Confetti ─────────────
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const cols = ["--accent", "--gold", "--indigo", "--good", "--ice", "--flame"].map(v => css.getPropertyValue(v).trim());
  const dpr = devicePixelRatio || 1;
  cv.hidden = false; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const ps = Array.from({ length: 150 }, (_, i) => ({ x: Math.random(), y: -Math.random() * .6, vx: (Math.random() - .5) * .25, vy: .15 + Math.random() * .3,
    spin: Math.random() * 12 - 6, size: (8 + Math.random() * 10) * dpr, c: cols[i % cols.length] }));
  const t0 = performance.now();
  const frame = now => {
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of ps) {
      const x = (p.x + p.vx * t) * cv.width, y = (p.y + p.vy * t + .08 * t * t) * cv.height;
      if (y > cv.height) continue;
      ctx.save(); ctx.translate(x, y); ctx.rotate(p.spin * t); ctx.fillStyle = p.c; ctx.fillRect(-p.size / 2, -p.size * .275, p.size, p.size * .55); ctx.restore();
    }
    if (t < 5) requestAnimationFrame(frame); else { cv.hidden = true; }
  };
  requestAnimationFrame(frame);
}

// ───────────── Events ─────────────
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case "tab": ui.tab = v; ui.confirmReset = false; render(); window.scrollTo(0, 0); break;
    case "track": ui.track = v; render(); break;
    case "lesson": startLesson(Course.unit(v)); break;
    case "review": startReview(); break;
    case "lightning": startLightning(); break;
    case "ans": answer(+v); break;
    case "next": next(); break;
    case "quit": quit(); break;
    case "speak": speak(v); break;
    case "home": ui.screen = "home"; render(); window.scrollTo(0, 0); break;
    case "goal": state.dailyGoal = +v; save(); render(); break;
    case "sound": state.sound = !state.sound; save(); render(); document.getElementById("sound")?.focus(); break;
    case "reset": ui.confirmReset = true; render(); break;
    case "reset-no": ui.confirmReset = false; render(); break;
    case "import": document.getElementById("apkg").click(); break;
    case "notice-x": ui.notice = null; render(); break;
    case "deck-remove": ui.confirmRemove = true; render(); break;
    case "deck-keep": ui.confirmRemove = false; render(); break;
    case "deck-remove-yes":
      try { localStorage.removeItem(DECK_KEY); } catch {}
      Course.install(null); ui.confirmRemove = false; if (ui.track === "deck") ui.track = "hiragana"; render(); break;
    case "reset-yes": state = { ...freshState(), dailyGoal: state.dailyGoal, sound: state.sound }; ui.confirmReset = false; save(); render(); break;
  }
});
document.addEventListener("keydown", e => {
  if (ui.screen !== "quiz") return;
  if (e.key === "Escape") return quit();
  if (/^[1-4]$/.test(e.key) && ui.session?.current?.ask && !ui.fb) answer(+e.key - 1);
  else if (e.key === "Enter" && (ui.fb || ui.session?.current?.teach)) { e.preventDefault(); next(); }
});
document.getElementById("apkg").addEventListener("change", async e => {
  const file = e.target.files?.[0];
  e.target.value = "";
  if (!file || ui.importing) return;
  ui.importing = true; ui.notice = null; render();
  try {
    const col = await readApkg(file);
    const deck = Anki.deck(col);
    Course.install(deck);
    try { localStorage.setItem(DECK_KEY, JSON.stringify(deck)); } catch {}
    const [ns, r] = Anki.merge(state, col);
    state = ns; save();
    ui.track = "deck"; ui.tab = "learn";
    ui.notice = { ok: true, title: `Imported ${deck.name}`, body: `${r.words} words added as the Anki track.` + (r.studied ? ` Your Anki history carried over: ${r.studied} studied, ${r.mastered} mastered.` : "") };
  } catch (err) {
    ui.notice = { ok: false, title: "Couldn't import that deck", body: err?.message || "The file couldn't be read as an Anki deck (.apkg)." };
  } finally {
    ui.importing = false; render(); window.scrollTo(0, 0);
  }
});
render();
</script>
